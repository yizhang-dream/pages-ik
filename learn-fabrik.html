<script type="application/json" id="course-data">{"file": "learn-fabrik.html", "num": 3, "title": "FABRIK：用位置迭代解多段骨链", "description": "从球面投影推导两次扫描，再解释初始化、收敛和扭转。", "kind": "fabrik", "lessons": [{"short": "位置与约束", "title": "先解关节点位置，随后恢复旋转\nSolve positions first, recover rotations second", "lead": "两根骨可以用余弦定理直接解。骨数增加后，多余自由度更多；FABRIK 用一组简单的位置更新寻找满足约束的构型。\nChapter 2 solved two bones. A longer chain is not a single elbow triangle. We now search for joint positions satisfying every segment length.", "body": "<aside class=\"learning-order\"><strong>本节为什么接在这里 / Why this lesson follows<\/strong><p lang=\"zh-CN\">第二章解决两段骨。三段以上不再只有一个肘三角形；从这里开始，先寻找满足所有段长的关节点位置。<\/p><p lang=\"en\">Chapter 2 solved two bones. A longer chain is not a single elbow triangle. We now search for joint positions satisfying every segment length.<\/p><a href=\"learn-two-bone.html#lesson-7\">回顾前一步 / Review the preceding step<\/a><\/aside><p><a href=\"#english-explanation\">直接看英文讲解 / Jump to the English explanation ↓<\/a><\/p><div class=\"parallel-copy\"><section lang=\"zh-CN\"><div class=\"language-heading\">中文讲解 / Chinese explanation<\/div><section class=\"pole-foundation\"><h2>同一个名称，控制的步骤不同 / Same name, different stages<\/h2><table><thead><tr><th>方法 / Method<\/th><th>这里的作用 / Role here<\/th><\/tr><\/thead><tbody>\n<tr><td>TwoBone<\/td><td>选择合法肘圆上的方向 e。<br><span lang=\"en\">Select e on the exact elbow circle.<\/span><\/td><\/tr>\n<tr><td>FABRIK 默认 / default<\/td><td>先把内点朝指定方向摆弯，再迭代；不是每轮硬性钉住平面。<br><span lang=\"en\">Bias internal initial points, then iterate; not an exact plane constraint each round.<\/span><\/td><\/tr>\n<tr><td>FABRIK 显式 pole 扭转 / explicit pole twist<\/td><td>另行对齐骨轴的横向参考轴；须启用 twist_reference=\"pole\"。<br><span lang=\"en\">Align a transverse reference axis only when pole twist is enabled.<\/span><\/td><\/tr>\n<tr><td>Shape IK / Helix<\/td><td>装配曲线的平面、凸出侧或起始径向，之后仍要修正直骨长度。<br><span lang=\"en\">Orient the curve plane, protruding side or initial radial direction before discrete correction.<\/span><\/td><\/tr>\n<\/tbody><\/table><a href=\"learn-two-bone.html#lesson-4\">返回 pole 的定义与推导 / Return to the derivation<\/a><\/section><h2>问题具体是什么<\/h2><p>设 n 根骨连接 n+1 个点 p₀,…,pₙ，根点 A 固定，目标为 T。未知量先选各点的位置，而不是每个关节的欧拉角。位置求解后，再使用第二章的旋转恢复方法生成局部旋转。<\/p><div class=\"equation\">p₀ = A；pₙ ≈ T；‖pᵢ₊₁ − pᵢ‖ = lᵢ，i = 0,…,n−1<\/div><p>这组方程没有要求每个关节如何弯曲，也没有限制关节角、避免碰撞或保证时间连续。因此可能有很多合法姿态。末端到位只是其中一个指标。<\/p><h2>把一个点投到球面上<\/h2><p>已固定点 q，希望另一点 p 与 q 相距 l。保持当前方向，把距离改成 l：<\/p><div class=\"equation\">p新 = q + l · (p旧 − q) / ‖p旧 − q‖<\/div><div class=\"worked\"><strong>算一遍<\/strong><p>q=(1,1,0)，p旧=(4,1,0)，l=2。方向是 (1,0,0)，所以 p新=(3,1,0)。改变的是关节点位置，骨长参数 l 没有变。<\/p><\/div><p>若 p旧=q，就无法归一化。当前实现使用该段静止骨向作为确定性后备方向。可复现的回退能避免 NaN，但不能替代“这个方向是否符合动画要求”的判断。<\/p><div class=\"callout\">图中是教学预设的初始化和逐步轨迹，严格复用当前 <code>FABRIK._iterate<\/code> 的更新规则。默认 <code>solve<\/code> 还会加入与 pole 有关的初始化扰动。<\/div><\/section><section class=\"english-copy\" id=\"english-explanation\" lang=\"en\"><div class=\"language-heading\">English explanation / 英文讲解<\/div><h2>What changes with more bones?<\/h2><p>Two fixed bones and an endpoint form one triangle. With more bones, additional internal joints provide more ways to bend. FABRIK stands for Forward And Backward Reaching Inverse Kinematics. It iterates over positions rather than solving all joint angles at once.<\/p><p>Let p₀,…,pₙ be joint positions and lᵢ the length between pᵢ and pᵢ₊₁. The requirements are a fixed root p₀=A, a desired tip pₙ=T, and ‖pᵢ₊₁−pᵢ‖=lᵢ. The chain's shape is not uniquely determined by these constraints.<\/p><h3>The basic length operation<\/h3><p>Hold one endpoint q fixed and move the other position onto the sphere of radius l centered at q:<\/p><div class=\"equation\">p_new=q+l(p_old−q)/‖p_old−q‖<\/div><p>The normalized vector gives a direction; multiplying by l sets the distance. If p_old=q, normalization is undefined. This implementation uses a deterministic rest-bone direction as a fallback. Preventing NaN does not establish that the fallback looks appropriate in an animation.<\/p><p>The diagram stores actual position updates using the current _iterate rules. Its initial poses are teaching presets. The default solve function also adds a bend-hint perturbation, explained in lesson 3. A valid position solution still needs local rotation recovery and an FK check, just as in the two-bone chapter.<\/p><\/section><\/div>", "question": "更新 p=q+l·normalize(p−q) 时，哪些量固定，哪些量改变？若 p=q，为什么必须另选方向？ / In p=q+l·normalize(p−q), which quantities stay fixed and which change? Why choose another direction when p=q?", "answer": "q 和 l 固定；p 的方向沿原射线、距离变成 l，除非原向量为零。零向量没有单位方向，必须回退到明确的非零方向。不能把零向量除以一个小 epsilon 后当作单位向量。 / The difference p_old−q gives direction; normalize it, multiply by l and add q. Its norm becomes l. A zero difference has no direction to normalize."}, {"short": "两次扫描", "title": "为什么一次扫描不够\nWhy each iteration has two sweeps", "lead": "把末端拉到目标会让根点偏移；把根点放回去又会让末端偏移。算法通过两次有顺序的扫描逐渐缩小这种冲突。\nWe can restore one length. Propagating that operation from the tip moves the root; propagating from the fixed root moves the tip.", "body": "<aside class=\"learning-order\"><strong>本节为什么接在这里 / Why this lesson follows<\/strong><p lang=\"zh-CN\">已经知道怎样恢复一段骨长。现在把这个操作依次传播：固定末端的扫描会移动根，固定根的扫描又会移动末端。<\/p><p lang=\"en\">We can restore one length. Propagating that operation from the tip moves the root; propagating from the fixed root moves the tip.<\/p><a href=\"learn-fabrik.html#lesson-0\">回顾前一步 / Review the preceding step<\/a><\/aside><p><a href=\"#english-explanation\">直接看英文讲解 / Jump to the English explanation ↓<\/a><\/p><div class=\"parallel-copy\"><section lang=\"zh-CN\"><div class=\"language-heading\">中文讲解 / Chinese explanation<\/div><h2>先从末端向根点扫描<\/h2><p>首先令 pₙ=T。然后 j 从 n−1 到 0，使用已经更新的 pⱼ₊₁，重新摆放 pⱼ。这叫顺序更新：同一轮后面的计算立即使用前面的新结果。<\/p><div class=\"equation\">pⱼ ← pⱼ₊₁ + lⱼ · normalize(pⱼ − pⱼ₊₁)<\/div><p>完整反扫结束时，每段长度都恢复，末端在目标上，但根点通常离开了 A。<\/p><h2>再从根点向末端扫描<\/h2><p>令 p₀=A。然后 j 从 1 到 n，依次重摆下一点：<\/p><div class=\"equation\">pⱼ ← pⱼ₋₁ + lⱼ₋₁ · normalize(pⱼ − pⱼ₋₁)<\/div><p>完整正扫结束时，根点在 A，每段长度都恢复，但末端通常尚未完全到位。此时计算末端误差，决定是否继续下一轮。<\/p><div class=\"worked\"><strong>算一遍<\/strong><p>初值 (0,0)、(0,1)、(0,2)，两段长均为 1，T=(1,1)。钉末端后，把肘从 (0,1) 投到目标的单位圆上，得到 (0,1)；根点也无需移动。此例一次即完成。若换成 T=(1.5,1)，根点在反扫后会移动，必须继续正扫。<\/p><\/div><div class=\"callout\">注意：每一次单点更新只保证被处理的那段长度。相邻的尚未处理段可能暂时失真。所有骨长在一次完整扫描结束时恢复；不能把源码注释中的“中间状态”理解为每一次微小更新都满足全部约束。使用“下一步”观察图下的段长残差。<\/div><\/section><section class=\"english-copy\" id=\"english-explanation\" lang=\"en\"><div class=\"language-heading\">English explanation / 英文讲解<\/div><h2>Tip-to-root sweep<\/h2><p>First put pₙ at T. For i=n−1 down to 0, keep pᵢ₊₁ fixed and place pᵢ at distance lᵢ from it. Each update restores the segment being handled. This direction of traversal carries the target constraint toward the root.<\/p><h3>Root-to-tip sweep<\/h3><p>The root may now be displaced, so put p₀ back at A. For i=0 up to n−1, keep pᵢ fixed and place pᵢ₊₁ at distance lᵢ. This carries the fixed-root condition back toward the tip. The tip may no longer be exactly T.<\/p><div class=\"equation\">Backward: pᵢ←pᵢ₊₁+lᵢ normalize(pᵢ−pᵢ₊₁)<br>Forward: pᵢ₊₁←pᵢ+lᵢ normalize(pᵢ₊₁−pᵢ)<\/div><p>Repeating the two sweeps reduces their conflict. The order is part of the algorithm: each update uses the newly updated adjacent position. Updating every joint from an old copy simultaneously would be a different procedure.<\/p><h3>Inspect an intermediate state correctly<\/h3><p>A single update may leave other lengths temporarily wrong, shown in orange. At the end of a complete forward sweep, all adjacent lengths have been restored, but endpoint error may remain. Move through one sweep at a time and watch which constraint is being fixed and which position is allowed to move.<\/p><p>A small endpoint error at one intermediate step does not establish a valid final chain. Check lengths and the fixed root at the appropriate completed stage.<\/p><\/section><\/div>", "question": "反扫末端正确、正扫根点正确，为什么两次扫描后仍可能需要下一轮？ / Why may another round be needed after a backward sweep fixes the tip and a forward sweep fixes the root?", "answer": "反扫把根点移出了 A。正扫重新固定根点并恢复各段长度，通常会再次改变末端位置。所以需要在完整正扫后检查 ‖pₙ−T‖，满足容差才停止。 / A tip-to-root sweep enforces the target but can move the root; restoring the root in the opposite sweep can move the tip. Repetition reduces the conflict."}, {"short": "初始化与 pole", "title": "同一目标可以得到不同解\nInitial shape and the limited role of a pole hint", "lead": "迭代规则只知道当前方向。初始化和 pole 会影响它走向哪一种弯曲姿态。\nSweeps follow current directions and may not create a sideways bend from a straight line. Here the bend direction biases initialization, rather than selecting an exact elbow.", "body": "<aside class=\"learning-order\"><strong>本节为什么接在这里 / Why this lesson follows<\/strong><p lang=\"zh-CN\">两次扫描只沿当前方向移动点，不能保证从直线中自行产生横向弯曲。这里重用第二章定义的弯曲方向，但作用改为初始化提示。<\/p><p lang=\"en\">Sweeps follow current directions and may not create a sideways bend from a straight line. Here the bend direction biases initialization, rather than selecting an exact elbow.<\/p><a href=\"learn-fabrik.html#lesson-1\">回顾前一步 / Review the preceding step<\/a><\/aside><p><a href=\"#english-explanation\">直接看英文讲解 / Jump to the English explanation ↓<\/a><\/p><div class=\"parallel-copy\"><section lang=\"zh-CN\"><div class=\"language-heading\">中文讲解 / Chinese explanation<\/div><h2>共线为什么会卡住<\/h2><p>若所有点和目标都在同一条直线上，球面投影仍沿这条线计算，无法凭空产生横向分量。有些目标明明可达，迭代却可能在共线构型之间重复，末端误差不降。<\/p><p>选择“共线目标 / 完全伸直初始化”，再选择“共线目标 / 弯曲初始化”。两种情况骨长、目标、迭代次数相同，只有初始内点的位置不同。观察第 8 轮结束后的末端误差。<\/p><h2>当前源码怎样摆弯<\/h2><div class=\"equation\">pᵢ ← pᵢ + bend · sin(πi/n) · pole_hint_scale · L，1 ≤ i &lt; n<\/div><p>默认 <code>pole_hint_scale=0.2<\/code>，L 为总骨长。sin 在根和末端为零、内点非零，因此扰动主要施加于链内部。加入扰动的初始化不必满足所有骨长，扫描会修回。<\/p><p>bend 来自 pole 在目标方向垂直平面上的投影；没有有效 pole 时选择确定性垂直方向。此处 pole 主要影响初始弯曲方向，不能理解为每轮都强制肘或整条链精确留在某个平面。<\/p><h2>可达区间仍要先判断<\/h2><div class=\"equation\">r最大 = Σlᵢ；r最小 = max(0，2max(lᵢ) − Σlᵢ)<\/div><p>例如长度 3、1、1，总长 5，但内半径是 1。离根 0.3 的目标无论怎样摆弯都到不了。改变 pole 不能改变这个几何事实。<\/p><\/section><section class=\"english-copy\" id=\"english-explanation\" lang=\"en\"><div class=\"language-heading\">English explanation / 英文讲解<\/div><h2>A reachable target can still stall<\/h2><p>If every joint and the target are collinear, the sphere projections stay on that line. A target may be geometrically reachable while this initialization fails to converge. Compare the straight and bent presets for the same collinear target after eight complete rounds.<\/p><h3>What the current solver adds<\/h3><p>Recall the pole vector from chapter 2: remove its component along the target direction to obtain a transverse bend direction. FABRIK uses that direction to displace internal points before iteration:<\/p><div class=\"equation\">pᵢ←pᵢ+bend·sin(πi/n)·pole_hint_scale·L, 0&lt;i&lt;n<\/div><p>The default scale is 0.2, L is total length, and the sine is zero at the ends. This initially bends the interior; it need not preserve all lengths because the sweeps repair them. With no useful hint, a deterministic perpendicular direction is used.<\/p><p>This is not the two-bone elbow-circle constraint. The pole chiefly selects a starting bias here. It does not mean that every iteration forces every joint into an exact pole plane.<\/p><h3>Reachability is still separate<\/h3><div class=\"equation\">r_max=Σlᵢ; r_min=max(0,2max(lᵢ)−Σlᵢ)<\/div><p>For lengths 3,1,1, total reach is 5 but minimum reach is 1. A target at distance 0.3 remains unreachable regardless of the hint. Initialization affects the numerical route and chosen pose; it does not change this bound.<\/p><\/section><\/div>", "question": "三根单位骨、目标距根 2、完全共线初始化。迭代卡住能否证明目标不可达？ / Three unit bones, target distance 2 and a fully collinear start: does stalled iteration prove unreachability?", "answer": "不能。可达半径为 [0,3]，距离 2 在可达区间。卡住可能是共线初始化造成的固定构型；用弯曲初值检查，再区分几何不可达与算法未收敛。 / No. A free chain of three unit bones reaches distance 2; a collinear start can stall because its projections do not create a transverse component. Reachability and convergence are separate."}, {"short": "收敛与代价", "title": "精度、轮数和状态要一起读\nRead error, iteration count and stopping status together", "lead": "误差很小是结果；为什么停下来，是另一条信息。\nNow separate geometric reachability from convergence under a particular initialization, iteration limit and tolerance.", "body": "<aside class=\"learning-order\"><strong>本节为什么接在这里 / Why this lesson follows<\/strong><p lang=\"zh-CN\">已有迭代过程。现在分清“目标几何上可达”与“当前初值、轮数和容差下是否收敛”。<\/p><p lang=\"en\">Now separate geometric reachability from convergence under a particular initialization, iteration limit and tolerance.<\/p><a href=\"learn-fabrik.html#lesson-2\">回顾前一步 / Review the preceding step<\/a><\/aside><p><a href=\"#english-explanation\">直接看英文讲解 / Jump to the English explanation ↓<\/a><\/p><div class=\"parallel-copy\"><section lang=\"zh-CN\"><div class=\"language-heading\">中文讲解 / Chinese explanation<\/div><h2>停止条件<\/h2><div class=\"equation\">e末端 = ‖pₙ − T‖ ≤ position_tolerance<\/div><p>当前默认容差是 10⁻⁹，默认最大轮数 4096。完整一轮包含两次遍历骨链，单轮 O(n)，K 轮约 O(Kn)。这不包含完整系统中绘制界面、读取数据等开销。<\/p><p>容差越严格，并不必然让视觉效果更好；接近伸直边界时可能多做很多轮。是否“够好”需要用骨长尺度和实际场景确定，不能只看一个漂亮的科学计数法数字。<\/p><table><thead><tr><th>条件<\/th><th>当前 FABRIK 结果<\/th><th>解释<\/th><\/tr><\/thead><tbody><tr><td>外不可达<\/td><td>UNREACHABLE，直接伸直<\/td><td>位置迭代为 0 轮，仍有初始化和旋转恢复成本<\/td><\/tr><tr><td>正常且误差达标<\/td><td>SUCCESS<\/td><td>满足位置阈值<\/td><\/tr><tr><td>正常但轮数耗尽<\/td><td>MAX_ITERATIONS<\/td><td>不能因此宣称目标不可达<\/td><\/tr><tr><td>内不可达或部分退化输入<\/td><td>DEGENERATE<\/td><td>保留尽力姿态，并说明回退原因<\/td><\/tr><\/tbody><\/table><h2>一个重要边界<\/h2><p>“某轮末端更近了”不等于“每个关节轨迹更平滑”。位置误差、骨长、形状、旋转跳变和耗时应分别观察。即使末端误差一直很小，整条链也可能突然切换到另一个分支。<\/p><\/section><section class=\"english-copy\" id=\"english-explanation\" lang=\"en\"><div class=\"language-heading\">English explanation / 英文讲解<\/div><h2>Measure the endpoint error<\/h2><p>Let e=‖pₙ−T‖. The solver compares its result against a position tolerance and limits the number of iterations. The tolerance has length units; a normalized error e/L is useful when comparing different skeleton scales.<\/p><p>Iteration count describes effort. A status describes why the procedure stopped. SUCCESS means the implementation's success conditions were met; MAX_ITERATIONS means the configured budget ended before the stopping criterion. It does not prove that no valid geometry exists.<\/p><h3>Use the trajectory rather than one number<\/h3><p>The curve in the diagram records endpoint error over completed sweeps. Observe fast early changes, slower later improvements and possible stalls. A tighter tolerance may require more rounds or hit the limit. Raising the limit cannot fix a truly unreachable target, a wrong reference frame or an invalid length definition.<\/p><p>The teaching sequence uses eight rounds so individual updates remain inspectable; it is not a performance benchmark for the default solver. Different initial poses can follow different trajectories for the same target.<\/p><h3>Read complete output<\/h3><p>Report endpoint error, maximum bone-length error, iterations, status and any fallback message. A finite pose can be a useful fallback even when it does not hit the target. After rotation recovery, measure the FK endpoint rather than assuming the position array and animation pose agree.<\/p><\/section><\/div>", "question": "算法返回 MAX_ITERATIONS 且末端误差 10⁻⁴。你能得出哪些结论，不能得出哪些结论？ / MAX_ITERATIONS with endpoint error 10⁻⁴: what can and cannot be concluded?", "answer": "在该初值、参数、迭代上限下没有达到指定阈值。不能推断目标几何不可达，也不能推断所有初值都会失败；先查可达区间、初始化、边界位置和误差随轮数变化。 / The configured iterations ended without meeting the stopping rule. Endpoint error is 10⁻⁴ in the stated units; inspect lengths, tolerance and FK. This neither proves geometric unreachability nor stable real-time behavior."}, {"short": "旋转与扭转", "title": "位置一致，旋转仍可能不同\nA bone direction does not determine axial twist", "lead": "一根骨的方向只提供两个旋转自由度；沿骨轴的自转不会移动骨末端。\nPosition constraints do not fully determine orientation. Rotating about a bone axis leaves its endpoint unchanged, so twist needs a separate convention.", "body": "<aside class=\"learning-order\"><strong>本节为什么接在这里 / Why this lesson follows<\/strong><p lang=\"zh-CN\">位置约束已经解释。下一层是完整旋转：沿骨轴自转不移动骨末端，因此还需要明确扭转的选择规则。<\/p><p lang=\"en\">Position constraints do not fully determine orientation. Rotating about a bone axis leaves its endpoint unchanged, so twist needs a separate convention.<\/p><a href=\"learn-fabrik.html#lesson-3\">回顾前一步 / Review the preceding step<\/a><\/aside><p><a href=\"#english-explanation\">直接看英文讲解 / Jump to the English explanation ↓<\/a><\/p><div class=\"parallel-copy\"><section lang=\"zh-CN\"><div class=\"language-heading\">中文讲解 / Chinese explanation<\/div><h2>最短弧恢复<\/h2><p>世界骨向 v=pᵢ₊₁−pᵢ，父级累计旋转为 R父。先转回父坐标系，v父=R父ᵀv，再取把静止骨向 b 旋到 v父的最短弧旋转 Q。下一段计算必须使用更新后的累计旋转。<\/p><h2>沿轴自转留下的自由度<\/h2><div class=\"equation\">Q新 = Q · Rot(b̂, φ)；Q新 b = Q b<\/div><p>因为 Rot(b̂,φ)b=b，额外绕骨轴旋转不会改变这根骨的指向。若后续骨也重新恢复局部旋转，可以保持整条链的位置，却改变各关节携带的参考轴朝向。<\/p><div class=\"worked\"><strong>算一遍<\/strong><p>b=(0,1,0)，Q 为单位矩阵。绕 Y 轴转 90°，骨末端仍是 (0,1,0)，但原本朝 X 的参考轴会转向 −Z。骨架的线段看起来一样，绑定在骨上的物体朝向可以不同。<\/p><\/div><p>当前 <code>twist_reference=\"minimal_arc\"<\/code> 是默认。显式设为 <code>\"pole\"<\/code> 时，将参考轴朝 pole 垂直于各骨轴的分量对齐；pole 缺失、近零或无法判定时有回退信息。不能把“画出骨架线”当作“扭转已检查”。<\/p><div class=\"callout\">课程图展示位置，不能显示完整关节参考轴。扭转应结合旋转矩阵或模型朝向检查。项目交互演示是否提供切换按键，也需要检查实际入口，而不是从求解器参数推断。<\/div><\/section><section class=\"english-copy\" id=\"english-explanation\" lang=\"en\"><div class=\"language-heading\">English explanation / 英文讲解<\/div><h2>One direction leaves a rotational freedom<\/h2><p>A unit direction has two degrees of freedom, while a 3D rotation has three. Let Q map a rest vector a to the desired bone b. An additional rotation around b preserves the mapped direction:<\/p><div class=\"equation\">Q′=Rot(b̂,φ)Q; Q′a=Rot(b̂,φ)b=b<\/div><p>For a bone along +Y, rotating 90° about Y leaves its endpoint at (0,1,0), but a reference axis previously along +X moves toward −Z. A line drawing cannot show this orientation difference. Downstream local rotations can be recovered again to preserve the entire chain's positions.<\/p><h3>The current implementation's choices<\/h3><p>The default twist_reference is minimal_arc. If explicitly set to pole, the solver aligns a transverse reference axis with the pole's projection perpendicular to each bone axis. Missing, near-zero or unusable projections invoke reported fallbacks.<\/p><p>This optional twist control is a third use of a pole vector. It is distinct from the default initialization bias and from the exact elbow direction in two-bone IK. Merely supplying a pole to FABRIK does not imply that pole twist mode is enabled.<\/p><p>Check rotation matrices, reference-axis directions or an attached object. The course's line diagram shows joint positions, not full frames. A solver parameter existing in Python also does not establish that a particular interactive demo exposes a switching key; inspect the actual UI entry.<\/p><\/section><\/div>", "question": "为何只比较关节点位置，无法判断两个结果的扭转是否相同？ / Why cannot joint positions alone establish equal twist?", "answer": "绕自身骨轴旋转不改变骨向与骨长，因此可具有相同关节点位置和不同参考轴朝向。应比较关节旋转或轴向参考向量，明确最短弧或 pole 扭转的选择规则。 / Yes. Axial rotations leave bone directions unchanged. Compare rotations or transverse reference axes, and state the chosen twist convention."}, {"short": "源码与复述", "title": "把算法说清楚，再定位到函数\nExplain the update before reading its implementation", "lead": "这一章结束时，你应能解释更新式、扫描顺序和失败原因，而不只是记住 FABRIK 的名字。\nSeparate projection, sweeps, initialization and twist. The next chapter retains length correction but uses a continuous curve to initialize a shape preference.", "body": "<aside class=\"learning-order\"><strong>本节为什么接在这里 / Why this lesson follows<\/strong><p lang=\"zh-CN\">把投影、扫描、初值与扭转分开说明。下一章保留段长修正，但先用连续曲线提供整条链的形状偏好。<\/p><p lang=\"en\">Separate projection, sweeps, initialization and twist. The next chapter retains length correction but uses a continuous curve to initialize a shape preference.<\/p><a href=\"learn-fabrik.html#lesson-4\">回顾前一步 / Review the preceding step<\/a><\/aside><p><a href=\"#english-explanation\">直接看英文讲解 / Jump to the English explanation ↓<\/a><\/p><div class=\"parallel-copy\"><section lang=\"zh-CN\"><div class=\"language-heading\">中文讲解 / Chinese explanation<\/div><h2>从哪个函数读起<\/h2><p><code>src/dhik/solvers/fabrik.py<\/code>：先看 <code>solve<\/code> 的参数与可达性判断，再看 <code>_iterate<\/code> 的两段循环，最后看旋转恢复和状态构造。每个数组索引都应对应一根具体骨。<\/p><pre><code>positions[n] = target\nfor j in range(n-1, -1, -1):\n    positions[j] = positions[j+1] + bones[j] * unit(positions[j]-positions[j+1])\npositions[0] = base\nfor j in range(1, n+1):\n    positions[j] = positions[j-1] + bones[j-1] * unit(positions[j]-positions[j-1])\n# 此处再检查末端误差；unit 的零向量分支不能省略。<\/code><\/pre><h2>现场预测练习<\/h2><p>先不要操作图，预测以下变化：①目标移到总长以外；②最长骨从 1 增到 3；③初始化完全共线；④只要求 pole 扭转；⑤容差缩小一千倍。分别说明会影响可达范围、解分支、位置、参考轴还是轮数。<\/p><p>再操作图验证前三类，并用源码解释后两类。后面的 Shape IK 会重用球面投影思想，但添加了曲线初始化和短时间的形状吸引。<\/p><\/section><section class=\"english-copy\" id=\"english-explanation\" lang=\"en\"><div class=\"language-heading\">English explanation / 英文讲解<\/div><h2>Follow the actual call path<\/h2><p>Read solve for input validation, reachability handling and initialization. Read FABRIK._iterate for the ordered sphere projections and stopping checks. Then follow the common rotation recovery and result finalization through FK.<\/p><p>Do not infer the algorithm from its name alone. Identify what each function receives, changes and returns. The source page contains the current relevant excerpts for this course.<\/p><h3>Predict before operating<\/h3><p>1. Moving a target beyond total length changes reachability. 2. Increasing the longest bone to 3 in a 3,1,1 chain creates minimum radius 1. 3. A completely collinear initialization can stall. 4. Explicit pole twist changes reference-axis choice while retaining solved positions. 5. A thousand-fold smaller tolerance can change the iteration count and status.<\/p><p>Use the diagram to check the first three position cases. Use the rotation code to check twist, since the line diagram cannot establish full orientation. Explain the expected effect before examining the output.<\/p><h3>Why Shape IK comes next<\/h3><p>FABRIK enforces lengths and an endpoint but does not encode a particular whole-chain shape. Shape IK first builds a curve with a geometric preference, samples it, and repairs the discrete lengths. That repair reuses the projection idea you have just derived.<\/p><\/section><\/div>", "question": "用自己的话复述完整流程，并给出“目标不可达”和“可达但未收敛”的区别。 / Explain the full pipeline and distinguish unreachable geometry from reachable but unconverged iteration.", "answer": "验证输入→取链与骨长→判断可达性→初始化并摆弯→从末端扫描→从根扫描→检查误差或轮数上限→恢复局部旋转→FK 检查→报告状态。不可达由骨长几何边界决定；未收敛描述某次数值算法没有达到阈值。 / State fixed-length projection, two ordered sweeps, initialization and stopping, then local rotation recovery and FK. Shape IK supplies a curve-based starting preference before discrete correction."}], "examples": [{"label": "非共线目标 / 3 根单位骨", "target": [1.5, 1.0, 0.0], "lengths": [1.0, 1.0, 1.0], "stages": [{"label": "初始化：内部点已加入摆弯", "round": 0, "phase": "initial", "points": [[0.0, 0.0, 0.0], [0.3031088913245535, 1.0, 0.0], [0.30310889132455354, 2.0, 0.0], [0.0, 3.0, 0.0]]}, {"label": "第 1 轮：把末端钉到目标", "round": 1, "phase": "pin-end", "points": [[0.0, 0.0, 0.0], [0.3031088913245535, 1.0, 0.0], [0.30310889132455354, 2.0, 0.0], [1.5, 1.0, 0.0]]}, {"label": "第 1 轮：从末端修正第 3 根骨", "round": 1, "phase": "backward", "points": [[0.0, 0.0, 0.0], [0.3031088913245535, 1.0, 0.0], [0.7325962761337147, 1.6411641947240645, 0.0], [1.5, 1.0, 0.0]]}, {"label": "第 1 轮：从末端修正第 2 根骨", "round": 1, "phase": "backward", "points": [[0.0, 0.0, 0.0], [0.1760632323894411, 0.8103387189346336, 0.0], [0.7325962761337147, 1.6411641947240645, 0.0], [1.5, 1.0, 0.0]]}, {"label": "第 1 轮：从末端修正第 1 根骨", "round": 1, "phase": "backward", "points": [[-0.036254302237432506, -0.16686200992815547, 0.0], [0.1760632323894411, 0.8103387189346336, 0.0], [0.7325962761337147, 1.6411641947240645, 0.0], [1.5, 1.0, 0.0]]}, {"label": "第 1 轮：把根点放回原位", "round": 1, "phase": "pin-root", "points": [[0.0, 0.0, 0.0], [0.1760632323894411
